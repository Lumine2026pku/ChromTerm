[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chromterm"
version = "1.0.0"
description = "果蝇唾腺染色体端部判读：本地网页 + 纯 numpy 推理"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ChromTerm contributors" }]
keywords = ["drosophila", "polytene chromosome", "image analysis", "classification"]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "Pillow>=9.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
chromterm = "chromterm.cli:main"

[project.urls]
Homepage = "https://github.com/<your-name>/ChromTerm"

[tool.setuptools]
packages = ["chromterm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
